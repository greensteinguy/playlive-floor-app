<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Check Raise tab icon: poker chip carrying the PlayLive "LP" monogram
       (the square emblem from the venue's official logo, playlive.melbourne,
       embedded as a data URI so the favicon stays a single file). The inner
       disc is white because the emblem is black + red. -->
  <circle cx="32" cy="32" r="30" fill="#ef2b2b"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="9.8 9.8" stroke-dashoffset="4.9"/>
  <circle cx="32" cy="32" r="17" fill="#ffffff"/>
  <clipPath id="emblem"><circle cx="32" cy="32" r="16"/></clipPath>
  <g clip-path="url(#emblem)">
    <image x="21" y="21" width="103.3" height="22" href="data:image/webp;base64,"/>
  </g>
</svg>
